name: Korvo regression checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korvo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Unit and source-security checks
        run: node --experimental-transform-types --test tests/*.test.mjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/korvo-tools" --no-audit --no-fund playwright@1.56.1 @electric-sql/pglite@0.3.14 sharp@0.34.5 @imagemagick/magick-wasm@0.0.44 deno@2.5.6 @supabase/supabase-js@2.117.3
          node "$RUNNER_TEMP/korvo-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Type-check staged evidence Edge entrypoint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix supabase/functions/verify-completion-photo
          echo '{"nodeModulesDir":"manual","compilerOptions":{"checkJs":false}}' > "$RUNNER_TEMP/korvo-tools/deno.json"
          "$RUNNER_TEMP/korvo-tools/node_modules/.bin/deno" check --config "$RUNNER_TEMP/korvo-tools/deno.json" supabase/functions/verify-completion-photo/index.ts
      - name: Dashboard, payment and recovery browser checks
        run: |
          export NODE_PATH="$RUNNER_TEMP/korvo-tools/node_modules"
          node tests/professional-opportunities.browser.cjs
          node tests/customer-professionals.browser.cjs
          node tests/stripe-connect.browser.cjs
          node tests/marketplace-payments.browser.cjs
          node tests/password-recovery.browser.cjs
          node tests/gig-foundation.browser.cjs
          node tests/workflow-reliability.browser.cjs
          node tests/completion-evidence.browser.cjs
          node tests/admin-refunds.browser.cjs
      - name: Isolated gig database permissions and scheduling
        run: NODE_PATH="$RUNNER_TEMP/korvo-tools/node_modules" node tests/gig-database.cjs
      - name: Isolated completion evidence and refund review
        run: |
          export NODE_PATH="$RUNNER_TEMP/korvo-tools/node_modules"
          node tests/evidence-refund-database.cjs
          node tests/completion-evidence-decoder.cjs
          node tests/evidence-wasm-decoder.cjs
          node tests/security-recovery.cjs
      - name: Validate opt-in integration runners
        run: python -m py_compile tests/sandbox-*-acceptance.py

# No deployment, credentials, live Stripe calls or privileged database writes.
# Actual sandbox integration runners require explicitly provisioned private fixtures.
