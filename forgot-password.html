<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recover your account | Korvo</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-page"><section class="auth-visual"><div class="auth-visual-content"><a href="index.html" class="logo">Korvo.</a><h1>Get back to your account.</h1><p>Request a secure link to reset your password.</p></div></section>
<section class="auth-form-section"><div class="auth-card"><div class="auth-heading"><h2>Forgot password?</h2><p>Enter the email you used for Korvo.</p></div>
<form id="recoveryRequestForm"><div class="form-group"><label for="recoveryEmail">Email address</label><input id="recoveryEmail" type="email" autocomplete="email" required></div><button class="primary-button full-button" type="submit">Send reset link</button></form>
<p id="recoveryStatus" role="status" aria-live="polite"></p><p><a href="login.html">Back to login</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="password-recovery.js"></script></body></html>
