<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset your password | Korvo</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-page"><section class="auth-visual"><div class="auth-visual-content"><a href="index.html" class="logo">Korvo.</a><h1>A fresh start for your account.</h1><p>Choose a unique password you do not use elsewhere.</p></div></section>
<section class="auth-form-section"><div class="auth-card"><div class="auth-heading"><h2>Reset password</h2></div>
<p id="recoveryStatus" role="status" aria-live="polite">Open the secure reset link from your email to continue.</p>
<form id="recoveryResetForm"><fieldset id="recoveryFields" disabled style="border:0"><div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></div>
<div class="form-group"><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="12" required></div><button class="primary-button full-button" type="submit">Save password</button></fieldset></form>
<p><a href="forgot-password.html">Request a new link</a> · <a href="login.html">Back to login</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script><script src="supabase.js"></script><script src="password-recovery.js"></script></body></html>
